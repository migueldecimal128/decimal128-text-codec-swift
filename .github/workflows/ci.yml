name: ci

# The codec is one Swift file with no dependencies, so CI exists to cover what a
# developer's host does not: the other platform, and the release configuration
# where the `verify` assertions are compiled out.
#
# The conformance vectors come from decimal128-resources, mounted as a submodule
# at <repo>/resources, so every checkout needs `submodules: recursive`. The
# 84,764-row canonical table comes with it, so it is now part of every run rather
# than something only a developer with a sibling checkout ever exercised.

on:
  push:
  pull_request:

jobs:
  macos:
    name: swift on macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: swift build
      # Debug arms VERIFY_ENABLED, so this run exercises the internal-state
      # assertions rather than compiling them out.
      - name: Test (debug, assertions armed)
        run: swift test
      # Release compiles them out, which is what a consumer gets. -enable-testing
      # is what lets @testable import reach the declet primitives at -O.
      - name: Test (release, assertions off)
        run: swift test -c release -Xswiftc -enable-testing

  linux:
    name: swift on ubuntu
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: swift build
      - name: Test (debug, assertions armed)
        run: swift test
      - name: Test (release, assertions off)
        run: swift test -c release -Xswiftc -enable-testing
